<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Form Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .main-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .progress-container {
            background: #f8f9fa;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin: 0 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1877f2, #42a5f5);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .step-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .step-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s ease;
        }

        .step-circle.active {
            background: #1877f2;
            color: white;
        }

        .step-content {
            padding: 32px 24px;
            min-height: 400px;
            position: relative;
        }

        .step {
            display: none;
            animation: slideIn 0.3s ease;
        }

        .step.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 16px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s ease;
            background: #fafbfc;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #1877f2;
            background: white;
            box-shadow: 0 0 0 4px rgba(24, 119, 242, 0.1);
        }

        .checkbox-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fafbfc;
        }

        .checkbox-item:hover {
            border-color: #1877f2;
            background: white;
        }

        .checkbox-item input:checked + .checkmark {
            background: #1877f2;
            border-color: #1877f2;
        }

        .checkbox-item input {
            display: none;
        }

        .checkmark {
            width: 20px;
            height: 20px;
            border: 2px solid #e9ecef;
            border-radius: 4px;
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .checkmark::after {
            content: '✔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: white;
            font-size: 12px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .checkbox-item input:checked + .checkmark::after {
            transform: translate(-50%, -50%) scale(1);
        }

        .checkbox-item input:checked + .checkmark {
            background: #1877f2;
            border-color: #1877f2;
        }

        .dynamic-section {
            margin-top: 24px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            display: none;
        }

        .dynamic-section.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 500px; }
        }

        .tag-input {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag-input input {
            flex: 1;
            margin-bottom: 0;
        }

        .tag {
            background: #1877f2;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 4px 4px 0;
        }

        .tag-remove {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .tag-remove:hover {
            background: rgba(255,255,255,0.2);
        }

        .size-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .size-checkbox {
            padding: 12px;
            text-align: center;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .size-checkbox:hover {
            border-color: #1877f2;
        }

        .size-checkbox input:checked + span {
            color: #1877f2;
            font-weight: 600;
        }

        .size-checkbox input {
            display: none;
        }

        .preview-container {
            position: relative;
            margin-top: 24px;
        }

        .mobile-preview {
            background: white;
            border-radius: 24px;
            padding: 40px 24px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            max-width: 360px;
            margin: 0 auto;
            position: relative;
        }

        .mobile-preview::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 6px;
            background: #ccc;
            border-radius: 3px;
        }

        .preview-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .preview-field {
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-title {
            font-size: 24px;
            font-weight: 700;
            color: #1877f2;
            text-align: center;
            margin-bottom: 8px;
        }

        .preview-description {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .preview-field input,
        .preview-field select {
            width: 100%;
            padding: 16px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            background: #fafbfc;
        }

        .preview-submit {
            background: linear-gradient(135deg, #1877f2, #42a5f5);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .result-section {
            text-align: center;
        }

        .json-output {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            word-break: break-all;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 8px;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .link-display {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin: 16px 0;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            border: 2px solid #e9ecef;
        }

        .bottom-nav {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 24px;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .nav-btn {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, #1877f2, #42a5f5);
            color: white;
            border-color: #1877f2;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .nav-btn.primary:hover {
            box-shadow: 0 8px 20px rgba(24, 119, 242, 0.4);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            
            .step-content {
                padding: 24px 20px;
            }
            
            .checkbox-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Form Builder</h1>
            <p>Create high-conversion landing pages for Facebook & Instagram</p>
        </div>

        <div class="main-card">
            <div class="progress-container">
                <div class="step-indicator">
                    <div class="step-circle active" id="step1-circle">1</div>
                    <div class="step-circle" id="step2-circle">2</div>
                    <div class="step-circle" id="step3-circle">3</div>
                    <div class="step-circle" id="step4-circle">4</div>
                    <div class="step-circle" id="step5-circle">5</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 20%"></div>
                </div>
            </div>

            <div class="step-content">
                <!-- Step 1: Page Information -->
                <div class="step" id="step2">
                    <div class="form-group">
                        <label>Page Name</label>
                        <input type="text" id="pageName" placeholder="My Awesome Store">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp Number</label>
                        <input type="tel" id="whatsapp" placeholder="+1 (555) 123-4567">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="contact@yourstore.com">
                    </div>
                    <div class="error" id="step1-error"></div>
                </div>

                <!-- Step 2: Advertisement Content -->
                <div class="step" id="step1">
                    <div class="form-group">
                        <label>Title (Optional)</label>
                        <input type="text" id="adTitle" placeholder="50% OFF Everything! Limited Time Only 🔥">
                    </div>
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="adDescription" rows="4" placeholder="Tap below to get your exclusive discount! Limited stock available...">Tap below to get your exclusive discount! Limited stock available...</textarea>
                        <div class="error" id="step2-error"></div>
                    </div>
                </div>

                <!-- Step 3: Form Builder -->
                <div class="step active" id="step3">
                    <div class="form-group">
                        <label>Select Form Fields</label>
                        <div class="checkbox-list">
                            <label class="checkbox-item">
                                <input type="checkbox" id="field-name">
                                <span class="checkmark"></span>
                                Name
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="field-phone">
                                <span class="checkmark"></span>
                                Phone
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="field-email">
                                <span class="checkmark"></span>
                                Email
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="field-color">
                                <span class="checkmark"></span>
                                Color
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="field-size">
                                <span class="checkmark"></span>
                                Size
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="field-shoe">
                                <span class="checkmark"></span>
                                Shoe Size
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="field-region">
                                <span class="checkmark"></span>
                                Region
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="field-address">
                                <span class="checkmark"></span>
                                Address
                            </label>
                        </div>
                    </div>

                    <!-- Dynamic Color Section -->
                    <div class="dynamic-section" id="color-section">
                        <label>Add Colors (comma separated or one by one)</label>
                        <div class="tag-input">
                            <input type="text" id="color-input" placeholder="Red, Blue, Green...">
                            <button type="button" class="nav-btn" onclick="addColor()">Add</button>
                        </div>
                        <div id="color-tags"></div>
                    </div>

                    <!-- Dynamic Size Section -->
                    <div class="dynamic-section" id="size-section">
                        <label>Select Available Sizes</label>
                        <div class="size-grid">
                            <label class="size-checkbox">
                                <input type="checkbox" value="S"><span>S</span>
                            </label>
                            <label class="size-checkbox">
                                <input type="checkbox" value="M"><span>M</span>
                            </label>
                            <label class="size-checkbox">
                                <input type="checkbox" value="L"><span>L</span>
                            </label>
